
name: Docker

on:
  workflow_dispatch:
  push:
    branches: [ main ]

env:
  ALIYUN_REGISTRY: "${{ secrets.ALIYUN_REGISTRY }}"
  ALIYUN_NAME_SPACE: "${{ secrets.ALIYUN_NAME_SPACE }}"
  ALIYUN_REGISTRY_USER: "${{ secrets.ALIYUN_REGISTRY_USER }}"
  ALIYUN_REGISTRY_PASSWORD: "${{ secrets.ALIYUN_REGISTRY_PASSWORD }}"

jobs:
  build:
    name: Pull
    runs-on: ubuntu-latest

    steps:
      # 1. 查看初始磁盘
      - name: Before freeing disk space
        run: |
          df -hT
          lsblk

      # 2. 扩容 Runner 可用空间
      - name: Maximize build space
        uses: easimon/maximize-build-space@master
        with:
          root-reserve-mb: 1024
          swap-size-mb: 128
          remove-dotnet: 'true'
          remove-haskell: 'true'
          remove-android: 'true'
          remove-codeql: 'true'
          build-mount-path: '/var/lib/docker/'

      # 3. 重启 Docker
      - name: Restart Docker
        run: |
          sudo service docker restart
          docker info
          df -hT

      # 4. Checkout
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      # 5. 登录阿里云
      - name: Docker Login
        run: |
          echo "$ALIYUN_REGISTRY_PASSWORD" | \
            docker login "$ALIYUN_REGISTRY" \
            -u "$ALIYUN_REGISTRY_USER" \
            --password-stdin

      # 6. 镜像处理
      - name: Pull and Push Images
        shell: bash
        run: |
          set -euo pipefail

          # 统计磁盘
          show_disk() {
            echo "========== Disk Usage =========="
            df -hT
            docker system df || true
            echo "================================"
          }

          # 清理当前镜像及无用镜像层
          cleanup_docker() {
            echo "开始清理 Docker 空间"

            docker image prune -af || true
            docker builder prune -af || true

            show_disk
          }

          show_disk

          declare -A duplicate_images
          declare -A temp_map

          # 第一遍：识别重名镜像
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue

            image=$(echo "$line" | awk '{print $NF}')
            image="${image%%@*}"

            image_name_tag="${image##*/}"
            name_space=$(echo "$image" | awk -F'/' \
              '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')

            name_space="${name_space}_"
            image_name="${image_name_tag%%:*}"

            if [[ -n "${temp_map[$image_name]:-}" ]]; then
              if [[ "${temp_map[$image_name]}" != "$name_space" ]]; then
                echo "duplicate image name: $image_name"
                duplicate_images[$image_name]="true"
              fi
            else
              temp_map[$image_name]="$name_space"
            fi

          done < images.txt

          # 第二遍：逐个拉取、推送、清理
          while IFS= read -r line || [[ -n "$line" ]]; do
            [[ -z "$line" || "$line" =~ ^[[:space:]]*# ]] && continue

            echo "处理镜像: $line"

            image=$(echo "$line" | awk '{print $NF}')
            platform=$(echo "$line" | awk -F'--platform[ =]' \
              '{if (NF>1) print $2}' | awk '{print $1}')

            # Pull
            docker pull $line

            if [[ -z "$platform" ]]; then
              platform_prefix=""
            else
              platform_prefix="${platform//\//_}_"
            fi

            image_name_tag="${image##*/}"

            name_space=$(echo "$image" | awk -F'/' \
              '{if (NF==3) print $2; else if (NF==2) print $1; else print ""}')

            image_name="${image_name_tag%%:*}"

            name_space_prefix=""
            if [[ -n "${duplicate_images[$image_name]:-}" ]]; then
              if [[ -n "$name_space" ]]; then
                name_space_prefix="${name_space}_"
              fi
            fi

            image_name_tag="${image_name_tag%%@*}"

            new_image="$ALIYUN_REGISTRY/$ALIYUN_NAME_SPACE/$platform_prefix$name_space_prefix$image_name_tag"

            # Tag
            docker tag "$image" "$new_image"

            # Push
            docker push "$new_image"

            echo "推送成功: $new_image"

            # 删除本地标签
            docker image rm "$image" "$new_image" || true

            # 清理未使用的镜像层
            cleanup_docker

          done < images.txt

          # 最终清理
          docker logout "$ALIYUN_REGISTRY" || true
          cleanup_docker

          echo "所有镜像处理完成"
